<text x="410.0" y="790.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#5F5E5A" dominant-baseline="central">Sun mọc ở 15° Leo (lặn ở 15° Aquarius).</text>
<text x="410.0" y="812.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#5F5E5A" dominant-baseline="central">Hành tinh nằm TRƯỚC Sun theo chuyển động ngày (phía trên chân trời lúc Sun mọc) là buổi sáng.</text>
<text x="410.0" y="834.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#5F5E5A" dominant-baseline="central">Vùng nam hóa và nữ hóa nằm từ 15° đến 120° tính từ Sun (phần chỉnh nâng cao của sách).</text>
<text x="410.0" y="856.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#5F5E5A" dominant-baseline="central">Sát Sun trong 15° và quá 120° thì không điều chỉnh (mình hiểu như vậy).</text>
