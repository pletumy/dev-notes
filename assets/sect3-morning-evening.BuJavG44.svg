<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1100" height="640" fill="#fff"/>
<text x="550.0" y="30.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#222" dominant-baseline="central">Morning rising và evening rising: một ngày trên bầu trời (sơ đồ minh họa)</text>
<rect x="70.0" y="60" width="240.0" height="370" fill="#2a3350"/>
<rect x="310.0" y="60" width="480.0" height="370" fill="#fff4c9"/>
<rect x="790.0" y="60" width="240.0" height="370" fill="#2a3350"/>
<rect x="70.0" y="430" width="960" height="60" fill="#8a7a5a"/>
<text x="550.0" y="460.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#fff" dominant-baseline="central">ĐƯỜNG CHÂN TRỜI (mặt đất)</text>
<path d="M310.0,430 Q550.0,-130 790.0,430" fill="none" stroke="#e0a800" stroke-width="6" />
<circle cx="550.0" cy="290" r="0"/>
<circle cx="550.0" cy="150" r="22" fill="#ffc107" stroke="#e0a800" stroke-width="3"/><text x="550.0" y="150.0" font-size="26" text-anchor="middle" font-weight="bold" fill="#222" dominant-baseline="central">☉</text>
<text x="550.0" y="108.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#8a6d00" dominant-baseline="central">Mặt Trời mọc 6h, lặn 18h</text>
<path d="M230.0,430 Q470.0,-30 710.0,430" fill="none" stroke="#1f5fa8" stroke-width="4.5" />
<path d="M390.0,430 Q630.0,-30 870.0,430" fill="none" stroke="#c2185b" stroke-width="4.5" stroke-dasharray="1,0"/>
<circle cx="470.0" cy="200" r="17" fill="#fff" stroke="#1f5fa8" stroke-width="3.5"/><text x="470.0" y="200.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#222" dominant-baseline="central">♀</text>
<circle cx="630.0" cy="200" r="17" fill="#fff" stroke="#c2185b" stroke-width="3.5"/><text x="630.0" y="200.0" font-size="20" text-anchor="middle" font-weight="bold" fill="#222" dominant-baseline="central">♀</text>
<rect x="230.0" y="360" width="80.0" height="70" fill="none" stroke="#1f5fa8" stroke-width="2" stroke-dasharray="6,4"/>
<text x="150.0" y="390.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#cfe3f7" dominant-baseline="central">thấy lúc rạng đông</text>
<text x="150.0" y="408.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#cfe3f7" dominant-baseline="central">(sao Mai)</text>
<rect x="790.0" y="360" width="80.0" height="70" fill="none" stroke="#c2185b" stroke-width="2" stroke-dasharray="6,4"/>
<text x="950.0" y="390.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#f8c6dc" dominant-baseline="central">thấy lúc hoàng hôn</text>
<text x="950.0" y="408.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#f8c6dc" dominant-baseline="central">(sao Hôm)</text>
<text x="70.0" y="505.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#555" dominant-baseline="central">0h</text>
<text x="190.0" y="505.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#555" dominant-baseline="central">3h</text>
<text x="310.0" y="505.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#555" dominant-baseline="central">6h</text>
<text x="430.0" y="505.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#555" dominant-baseline="central">9h</text>
<text x="550.0" y="505.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#555" dominant-baseline="central">12h</text>
<text x="670.0" y="505.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#555" dominant-baseline="central">15h</text>
<text x="790.0" y="505.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#555" dominant-baseline="central">18h</text>
<text x="910.0" y="505.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#555" dominant-baseline="central">21h</text>
<text x="1030.0" y="505.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#555" dominant-baseline="central">24h</text>
<text x="270.0" y="100.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#aab" dominant-baseline="central">ĐÊM</text>
<text x="910.0" y="100.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#aab" dominant-baseline="central">ĐÊM</text>
<text x="550.0" y="406.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#8a6d00" dominant-baseline="central">BAN NGÀY</text>
<rect x="60" y="525" width="22" height="6" fill="#1f5fa8"/><text x="92.0" y="528.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222" dominant-baseline="central">Hành tinh MORNING: mọc sớm hơn Sun (4h), nên đứng "trước" Sun trên vòng hoàng đạo (kinh độ nhỏ hơn). Sách: nam hóa, thuộc đội Sun.</text>
<rect x="60" y="555" width="22" height="6" fill="#c2185b"/><text x="92.0" y="558.0" font-size="13" text-anchor="start" font-weight="normal" fill="#222" dominant-baseline="central">Hành tinh EVENING: mọc muộn hơn Sun (8h), nên đứng "sau" Sun (kinh độ lớn hơn). Sách: nữ hóa, thuộc đội Moon.</text>
<text x="60.0" y="588.0" font-size="12" text-anchor="start" font-weight="normal" fill="#666" dominant-baseline="central">(Hai vòng cung xanh/hồng là cùng một hành tinh ở hai tình huống khác nhau, ví dụ Venus lúc là "sao Mai" và lúc là "sao Hôm".)</text>
</svg>