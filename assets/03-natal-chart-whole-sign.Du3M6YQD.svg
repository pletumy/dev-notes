<text x="380.0" y="550.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#2C2C2A" dominant-baseline="central">Đường cam đứt = đường chân trời (nối Asc và Dsc). Sun nằm bên dưới nên đây là lá số ĐÊM.</text>
<text x="380.0" y="576.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#5F5E5A" dominant-baseline="central">Đúng phe (đêm): Moon, Venus, Mars. Trái phe: Sun, Jupiter, Saturn, Mercury (Mercury mọc trước Sun nên theo phe ngày).</text>
<text x="380.0" y="602.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#5F5E5A" dominant-baseline="central">Số trong vòng = house whole sign. Vòng ngoài = sign. Uranus, Neptune, Pluto bỏ qua theo cách đọc cổ điển.</text>
