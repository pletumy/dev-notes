<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="440.0" y="28.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#2C2C2A" dominant-baseline="central">Quy tắc theo SỐ ĐỘ: nhỏ hơn Sun = buổi sáng, lớn hơn Sun = buổi chiều</text>
<rect x="70" y="90" width="240" height="64" fill="#F1EFE8" stroke="#B4B2A9"/>
<text x="80.0" y="102.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5F5E5A" dominant-baseline="central">Cancer</text>
<rect x="310" y="90" width="240" height="64" fill="#F1EFE8" stroke="#B4B2A9"/>
<text x="320.0" y="102.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5F5E5A" dominant-baseline="central">Leo</text>
<rect x="550" y="90" width="240" height="64" fill="#F1EFE8" stroke="#B4B2A9"/>
<text x="560.0" y="102.0" font-size="12" text-anchor="start" font-weight="normal" fill="#5F5E5A" dominant-baseline="central">Virgo</text>
<rect x="70" y="90" width="240" height="64" fill="#F5C4B3" fill-opacity="0.55"/>
<rect x="550" y="90" width="240" height="64" fill="#B5D4F4" fill-opacity="0.55"/>
<rect x="310" y="90" width="240" height="64" fill="#E8E6DF"/>
<rect x="70" y="90" width="240" height="64" fill="none" stroke="#B4B2A9"/>
<rect x="310" y="90" width="240" height="64" fill="none" stroke="#B4B2A9"/>
<rect x="550" y="90" width="240" height="64" fill="none" stroke="#B4B2A9"/>
<text x="70.0" y="170.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#5F5E5A" dominant-baseline="central">0° Cancer</text>
<text x="310.0" y="170.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#5F5E5A" dominant-baseline="central">0° Leo</text>
<text x="550.0" y="170.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#5F5E5A" dominant-baseline="central">0° Virgo</text>
<text x="790.0" y="170.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#5F5E5A" dominant-baseline="central">0° Libra</text>
<circle cx="270" cy="122" r="15" fill="#C0DD97" stroke="#3B6D11" stroke-width="2"/>
<text x="270.0" y="122.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#2C2C2A" dominant-baseline="central">Me</text>
<text x="270.0" y="70.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#2C2C2A" dominant-baseline="central">25° Cancer</text>
<circle cx="430" cy="122" r="15" fill="#EF9F27" stroke="#BA7517" stroke-width="2"/>
<text x="430.0" y="122.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#2C2C2A" dominant-baseline="central">Su</text>
<text x="430.0" y="70.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#2C2C2A" dominant-baseline="central">15° Leo</text>
<circle cx="590" cy="122" r="15" fill="#C0DD97" stroke="#3B6D11" stroke-width="2"/>
<text x="590.0" y="122.0" font-size="12" text-anchor="middle" font-weight="bold" fill="#2C2C2A" dominant-baseline="central">Me</text>
<text x="590.0" y="70.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#2C2C2A" dominant-baseline="central">5° Virgo</text>
<line x1="420" y1="215" x2="110" y2="215" stroke="#5F5E5A" stroke-width="2" marker-end="url(#ar)"/>
<line x1="440" y1="215" x2="750" y2="215" stroke="#5F5E5A" stroke-width="2" marker-end="url(#ar)"/>
<text x="246.0" y="250.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#993C1D" dominant-baseline="central">Số độ NHỎ hơn Sun</text>
<text x="246.0" y="270.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#993C1D" dominant-baseline="central">(đứng sau Sun trên vòng hoàng đạo)</text>
<text x="246.0" y="290.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#993C1D" dominant-baseline="central">= mọc TRƯỚC Sun = buổi SÁNG</text>
<text x="246.0" y="310.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#993C1D" dominant-baseline="central">= nam hóa</text>
<text x="614.0" y="250.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#185FA5" dominant-baseline="central">Số độ LỚN hơn Sun</text>
<text x="614.0" y="270.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#185FA5" dominant-baseline="central">(đứng trước Sun trên vòng hoàng đạo)</text>
<text x="614.0" y="290.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#185FA5" dominant-baseline="central">= mọc SAU Sun = buổi CHIỀU</text>
<text x="614.0" y="310.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#185FA5" dominant-baseline="central">= nữ hóa</text>
<text x="440.0" y="350.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#5F5E5A" dominant-baseline="central">Vì sao ngược với trực giác? Sun đi chậm theo chiều TĂNG độ, nhưng bầu trời quay mỗi ngày theo chiều NGƯỢC lại.</text>
<text x="440.0" y="372.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#5F5E5A" dominant-baseline="central">Nên hành tinh có số độ nhỏ hơn thì được bầu trời đưa lên trước, tức mọc trước Sun.</text>
<text x="440.0" y="400.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#5F5E5A" dominant-baseline="central">Chỉ xét trong vòng 180° từ Sun (tới điểm đối Sun). Cách tính: số độ tuyệt đối = 30 × (số thứ tự sign từ Aries, bắt đầu 0) + độ trong sign.</text>
</svg>
