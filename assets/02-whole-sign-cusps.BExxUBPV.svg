<text x="380.0" y="584.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#5F5E5A" dominant-baseline="central">Đậm = angular, vừa = succedent, nhạt = cadent. Độ của các góc là ước lượng từ hình phần mềm.</text>
