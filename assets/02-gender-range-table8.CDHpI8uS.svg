<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600" width="860" height="600" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="430.0" y="28.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#2C2C2A" dominant-baseline="central">Table 8: phạm vi biểu hiện nữ hóa và nam hóa của hành tinh</text>
<text x="325.0" y="70.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#2C2C2A" dominant-baseline="central">Điều kiện NỮ  ←</text>
<text x="515.0" y="70.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#2C2C2A" dominant-baseline="central">Điều kiện TRUNG TÍNH</text>
<text x="705.0" y="70.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#2C2C2A" dominant-baseline="central">→  Điều kiện NAM</text>
<text x="216.0" y="125.0" font-size="14" text-anchor="end" font-weight="bold" fill="#2C2C2A" dominant-baseline="central">Hành tinh NỮ</text>
<text x="216.0" y="145.0" font-size="12" text-anchor="end" font-weight="normal" fill="#5F5E5A" dominant-baseline="central">(Moon, Venus)</text>
<rect x="230" y="95" width="190" height="76" fill="#85B7EB" stroke="#FFFFFF" stroke-width="3"/>
<text x="325.0" y="133.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#2C2C2A" dominant-baseline="central">Cực kỳ nữ tính</text>
<rect x="420" y="95" width="190" height="76" fill="#B5D4F4" stroke="#FFFFFF" stroke-width="3"/>
<text x="515.0" y="133.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#2C2C2A" dominant-baseline="central">Nữ tính</text>
<rect x="610" y="95" width="190" height="76" fill="#E1D5E7" stroke="#FFFFFF" stroke-width="3"/>
<text x="705.0" y="133.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#2C2C2A" dominant-baseline="central">Nữ tính bị nam hóa</text>
<text x="216.0" y="215.0" font-size="14" text-anchor="end" font-weight="bold" fill="#2C2C2A" dominant-baseline="central">Hành tinh NAM</text>
<text x="216.0" y="235.0" font-size="12" text-anchor="end" font-weight="normal" fill="#5F5E5A" dominant-baseline="central">(Sun, Mars, Jupiter, Saturn)</text>
<rect x="230" y="185" width="190" height="76" fill="#F7D5C8" stroke="#FFFFFF" stroke-width="3"/>
<text x="325.0" y="223.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#2C2C2A" dominant-baseline="central">Nam tính bị nữ hóa</text>
<rect x="420" y="185" width="190" height="76" fill="#F5B8A0" stroke="#FFFFFF" stroke-width="3"/>
<text x="515.0" y="223.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#2C2C2A" dominant-baseline="central">Nam tính</text>
<rect x="610" y="185" width="190" height="76" fill="#F0997B" stroke="#FFFFFF" stroke-width="3"/>
<text x="705.0" y="223.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#2C2C2A" dominant-baseline="central">Cực kỳ nam tính</text>
<text x="430.0" y="300.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#2C2C2A" dominant-baseline="central">Cùng một thang, xếp từ nữ đến nam (thứ tự do mình sắp theo trực giác)</text>
<line x1="70" y1="360" x2="790" y2="360" stroke="#5F5E5A" stroke-width="3" marker-end="url(#ar)"/>
<text x="70.0" y="332.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#185FA5" dominant-baseline="central">NỮ</text>
<text x="790.0" y="332.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#993C1D" dominant-baseline="central">NAM</text>
<circle cx="120" cy="360" r="14" fill="#85B7EB" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="120.0" y="395.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#2C2C2A" dominant-baseline="central">Cực kỳ</text>
<text x="120.0" y="412.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#2C2C2A" dominant-baseline="central">nữ tính</text>
<circle cx="248" cy="360" r="14" fill="#B5D4F4" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="248.0" y="395.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#2C2C2A" dominant-baseline="central">Nữ</text>
<text x="248.0" y="412.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#2C2C2A" dominant-baseline="central">tính</text>
<circle cx="376" cy="360" r="14" fill="#E1D5E7" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="376.0" y="395.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#2C2C2A" dominant-baseline="central">Nữ tính</text>
<text x="376.0" y="412.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#2C2C2A" dominant-baseline="central">bị nam hóa</text>
<circle cx="504" cy="360" r="14" fill="#F7D5C8" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="504.0" y="395.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#2C2C2A" dominant-baseline="central">Nam tính</text>
<text x="504.0" y="412.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#2C2C2A" dominant-baseline="central">bị nữ hóa</text>
<circle cx="632" cy="360" r="14" fill="#F5B8A0" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="632.0" y="395.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#2C2C2A" dominant-baseline="central">Nam</text>
<text x="632.0" y="412.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#2C2C2A" dominant-baseline="central">tính</text>
<circle cx="760" cy="360" r="14" fill="#F0997B" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="760.0" y="395.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#2C2C2A" dominant-baseline="central">Cực kỳ</text>
<text x="760.0" y="412.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#2C2C2A" dominant-baseline="central">nam tính</text>
<text x="430.0" y="470.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#5F5E5A" dominant-baseline="central">Hai trạng thái giữa (nam hóa, nữ hóa) là trạng thái pha trộn: bản chất giữ nguyên nhưng biểu hiện nghiêng về phía ngược lại.</text>
<text x="430.0" y="492.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#5F5E5A" dominant-baseline="central">Giống Table 6 của benefic/malefic: có mức cơ sở (hàng giữa), rồi điều kiện đẩy sang hai phía.</text>
<text x="430.0" y="540.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#2C2C2A" dominant-baseline="central">Ví dụ: Venus (nữ) ở điều kiện nam → nữ tính bị nam hóa. Mars (nam) ở điều kiện nữ → nam tính bị nữ hóa.</text>
</svg>
