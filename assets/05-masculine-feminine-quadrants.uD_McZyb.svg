<text x="410.0" y="742.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#2C2C2A" dominant-baseline="central">Cách nhớ (mình diễn giải từ ý của sách): TIẾN TỚI điểm cực (MC hoặc IC) = nam; RỜI khỏi điểm cực = nữ.</text>
<text x="410.0" y="764.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#5F5E5A" dominant-baseline="central">Houses ở mỗi góc phần tư được chia đều cho dễ vẽ. Hệ quadrant thực tế chia không đều.</text>
