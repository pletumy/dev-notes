<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="430.0" y="26.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#2C2C2A" dominant-baseline="central">Aspect theo sign, nhưng cách aspect chính xác bao nhiêu độ?</text>
<text x="430.0" y="52.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#5F5E5A" dominant-baseline="central">Thanh càng ngắn = hai hành tinh càng sát góc aspect chính xác</text>
<rect x="330" y="84" width="176" height="492" fill="#9FE1CB" fill-opacity="0.35"/>
<text x="418.0" y="70.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#0F6E56" dominant-baseline="central">orb ví dụ ±8°</text>
