<rect x="330" y="553.0" width="440" height="16" fill="#B4B2A9"/>
<text x="778.0" y="561.0" font-size="13" text-anchor="start" font-weight="bold" fill="#2C2C2A" dominant-baseline="central">20°</text>
<line x1="330" y1="84" x2="330" y2="576" stroke="#2C2C2A" stroke-width="2"/>
<text x="430.0" y="596.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#2C2C2A" dominant-baseline="central">Xanh = nằm trong orb (aspect chặt). Xám = có aspect theo sign nhưng lệch xa góc chính xác.</text>
<text x="430.0" y="622.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#5F5E5A" dominant-baseline="central">Số độ tính từ độ nguyên trong bảng phần mềm, nên có sai số khoảng 1°. Orb ±8° chỉ để minh họa, tùy tác giả.</text>
</svg>
