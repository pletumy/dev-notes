<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 530" width="860" height="530" font-family="Helvetica, Arial, sans-serif">
<defs></defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="430.0" y="28.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#2C2C2A" dominant-baseline="central">Vĩ độ thiên thể (celestial latitude) khác với declination</text>
<line x1="60" y1="300" x2="800" y2="300" stroke="#5F5E5A" stroke-width="2.5" stroke-dasharray="8 6"/>
<line x1="60" y1="400" x2="800" y2="200" stroke="#BA7517" stroke-width="3"/>
<text x="60.0" y="322.0" font-size="13" text-anchor="start" font-weight="bold" fill="#5F5E5A" dominant-baseline="central">Celestial equator (xích đạo thiên cầu)</text>
<text x="800.0" y="176.0" font-size="13" text-anchor="end" font-weight="bold" fill="#BA7517" dominant-baseline="central">Ecliptic (đường đi biểu kiến của Sun)</text>
<line x1="330.0" y1="327.0" x2="306.5" y2="240.1" stroke="#993C1D" stroke-width="3"/>
<circle cx="306.5" cy="240.1" r="14" fill="#F5C4B3" stroke="#993C1D" stroke-width="2"/>
<text x="306.5" y="240.1" font-size="13" text-anchor="middle" font-weight="bold" fill="#2C2C2A" dominant-baseline="central">P</text>
<text x="282.5" y="188.1" font-size="13" text-anchor="end" font-weight="bold" fill="#993C1D" dominant-baseline="central">Vĩ độ BẮC (phía bắc ecliptic)</text>
<text x="282.5" y="206.1" font-size="13" text-anchor="end" font-weight="bold" fill="#993C1D" dominant-baseline="central">→ nam hóa</text>
<line x1="700.0" y1="227.0" x2="710.4" y2="265.6" stroke="#185FA5" stroke-width="3"/>
<circle cx="710.4" cy="265.6" r="14" fill="#B5D4F4" stroke="#185FA5" stroke-width="2"/>
<text x="710.4" y="265.6" font-size="13" text-anchor="middle" font-weight="bold" fill="#2C2C2A" dominant-baseline="central">Q</text>
<line x1="710.4" y1="265.6" x2="710.4" y2="300.0" stroke="#5F5E5A" stroke-width="2" stroke-dasharray="3 3"/>
<text x="820.0" y="377.6" font-size="13" text-anchor="end" font-weight="bold" fill="#185FA5" dominant-baseline="central">Vĩ độ NAM (phía nam ecliptic)</text>
<text x="820.0" y="395.6" font-size="13" text-anchor="end" font-weight="bold" fill="#185FA5" dominant-baseline="central">→ nữ hóa</text>
<text x="680.4" y="313.6" font-size="12" text-anchor="end" font-weight="normal" fill="#5F5E5A" dominant-baseline="central">Nhưng Q vẫn nằm phía bắc</text>
<text x="680.4" y="329.6" font-size="12" text-anchor="end" font-weight="normal" fill="#5F5E5A" dominant-baseline="central">xích đạo thiên cầu</text>
<text x="680.4" y="345.6" font-size="12" text-anchor="end" font-weight="normal" fill="#5F5E5A" dominant-baseline="central">(declination bắc)</text>
<line x1="60" y1="440" x2="100" y2="440" stroke="#BA7517" stroke-width="3"/>
<text x="110.0" y="440.0" font-size="13" text-anchor="start" font-weight="normal" fill="#2C2C2A" dominant-baseline="central">Vĩ độ = khoảng cách vuông góc tới ecliptic (đây là điều kiện giới tính của sách)</text>
<line x1="60" y1="468" x2="100" y2="468" stroke="#5F5E5A" stroke-width="2" stroke-dasharray="3 3"/>
<text x="110.0" y="468.0" font-size="13" text-anchor="start" font-weight="normal" fill="#2C2C2A" dominant-baseline="central">Declination = khoảng cách tới xích đạo thiên cầu (dùng cho cách đọc "out of bounds")</text>
<text x="430.0" y="500.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#5F5E5A" dominant-baseline="central">Hình minh họa phóng đại độ nghiêng. Sun luôn nằm trên ecliptic nên vĩ độ của Sun luôn bằng 0.</text>
</svg>
