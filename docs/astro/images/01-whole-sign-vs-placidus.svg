<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="400.0" y="24.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#2C2C2A" dominant-baseline="central">Cùng một lá số, hai cách chia house (Asc ≈ 26° Libra, Moon 11° Libra)</text>
<text x="368.0" y="52.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#2C2C2A" dominant-baseline="central">Moon 11° Libra</text>
<text x="488.0" y="52.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#BA7517" dominant-baseline="central">Asc ≈ 26° Libra</text>
<line x1="368" y1="64" x2="368" y2="318" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4"/>
<line x1="488" y1="64" x2="488" y2="318" stroke="#BA7517" stroke-width="2.5"/>
<text x="40.0" y="84.0" font-size="14" text-anchor="start" font-weight="bold" fill="#2C2C2A" dominant-baseline="central">WHOLE SIGN (mỗi house = trọn một sign)</text>
<rect x="40" y="96" width="240" height="56" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
<text x="160.0" y="138.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#2C2C2A" dominant-baseline="central">House 12 · Virgo</text>
<rect x="280" y="96" width="240" height="56" fill="#9FE1CB" stroke="#B4B2A9" stroke-width="1"/>
<text x="432.0" y="138.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#2C2C2A" dominant-baseline="central">House 1 · Libra</text>
<rect x="520" y="96" width="240" height="56" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
<text x="640.0" y="138.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#2C2C2A" dominant-baseline="central">House 2 · Scorpio</text>
<text x="280.0" y="170.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#5F5E5A" dominant-baseline="central">0° Libra</text>
<text x="520.0" y="170.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#5F5E5A" dominant-baseline="central">0° Scorpio</text>
<circle cx="368" cy="110" r="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="40.0" y="236.0" font-size="14" text-anchor="start" font-weight="bold" fill="#2C2C2A" dominant-baseline="central">PLACIDUS (hệ quadrant)</text>
<rect x="40" y="248" width="260" height="56" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
<text x="170.0" y="290.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#2C2C2A" dominant-baseline="central">House 11</text>
<rect x="300" y="248" width="188" height="56" fill="#F7C1C1" stroke="#B4B2A9" stroke-width="1"/>
<text x="436.0" y="290.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#2C2C2A" dominant-baseline="central">House 12</text>
<rect x="488" y="248" width="272" height="56" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
<text x="624.0" y="290.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#2C2C2A" dominant-baseline="central">House 1 (bắt đầu từ Asc)</text>
<line x1="300" y1="244" x2="300" y2="308" stroke="#5F5E5A" stroke-width="2" stroke-dasharray="3 3"/>
<text x="300.0" y="330.0" font-size="12" text-anchor="middle" font-weight="normal" fill="#5F5E5A" dominant-baseline="central">cusp 12: vị trí tùy phần mềm (vẽ minh họa)</text>
<circle cx="368" cy="262" r="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1.5"/>
<text x="40.0" y="364.0" font-size="14" text-anchor="start" font-weight="bold" fill="#0F6E56" dominant-baseline="central">Whole sign: Moon ở house 1, vì cùng sign Libra với Asc.</text>
<text x="40.0" y="392.0" font-size="14" text-anchor="start" font-weight="bold" fill="#A32D2D" dominant-baseline="central">Placidus: Moon ở house 12, vì nằm trước điểm Asc.</text>
</svg>
